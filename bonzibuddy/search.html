<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Search Bonzi.com continuation</title><style>body{font:16px Arial;max-width:850px;margin:30px auto;padding:0 18px;line-height:1.5}input{font:inherit;padding:8px;max-width:70%}button{font:inherit;padding:8px}li{margin:20px 0}a{color:#503477}</style><body><p><a href="index.html">Bonzi.com homepage</a> · <a href="downloads.html">Downloads</a></p><h1>Search Bonzi.com continuation</h1><p>Search the Bonzi.com continuation pages. Today: <span data-bonzi-today>October 13, 2026</span>. Last website update: October 13, 2026.</p><form method="get" action="search.html"><label for="q">Search words</label> <input id="q" name="keywords" required><button>Search</button></form><p id="status" aria-live="polite"></p><ol id="results"></ol><script src="search-data.js"></script><script>const q=new URLSearchParams(location.search).get('keywords')||'';document.getElementById('q').value=q;const terms=q.toLowerCase().trim().split(/\s+/).filter(Boolean);const matches=terms.length?BONZI_PAGES.filter(p=>terms.every(t=>(p.title+' '+p.text).toLowerCase().includes(t))).map(p=>({p,score:terms.reduce((s,t)=>s+(p.title.toLowerCase().includes(t)?10:1),0)})).sort((a,b)=>b.score-a.score):[];document.getElementById('status').textContent=terms.length?matches.length+' matching pages. Showing up to 50.':'Enter words to search.';for(const {p} of matches.slice(0,50)){const li=document.createElement('li');const a=document.createElement('a');a.href=p.url;a.textContent=p.title;const excerpt=document.createElement('p');excerpt.textContent=p.text.slice(0,220)+'…';li.append(a,excerpt);document.getElementById('results').append(li)}</script><script src="automatic-date.js"></script></body></html>
