<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Closest Factor Pair Calculator — Arthur Tube</title><style>body{margin:0;background:#091b55;color:#162250;font:16px/1.6 Verdana,Arial,sans-serif}main{max-width:760px;margin:40px auto;padding:24px}.window{background:#fffdf2;border:3px solid #20316c;box-shadow:7px 7px 0 #030c30}.title{background:#102b7b;color:white;padding:10px 16px;font-weight:bold}.inside{padding:26px}h1{margin-top:0}input{width:min(100%,320px);padding:11px;font-size:18px;border:2px solid #20316c}button,a.button{display:inline-block;margin:8px 4px 8px 0;padding:10px 14px;border:2px solid #20316c;background:#ffdc50;color:#162250;font-weight:bold;text-decoration:none;cursor:pointer}.result{margin-top:18px;padding:16px;background:#eaf0ff;border-left:5px solid #102b7b;overflow-wrap:anywhere}.result strong{font-size:24px}</style></head><body><main><div class="window"><div class="title">Arthur Tube · Math Tool</div><div class="inside"><h1>Closest Factor Pair Calculator</h1><p>Enter a positive whole number to find its closest factors and every factor pair.</p><label for="n"><strong>Number</strong></label><br><input id="n" type="number" min="1" step="1" value="672"><button id="go">Find closest factors</button><div class="result" id="r" aria-live="polite"><strong>672 = 24 × 28</strong><p>Difference: 4</p><p>Factor pairs: 1×672, 2×336, 3×224, 4×168, 6×112, 7×96, 8×84, 12×56, 14×48, 16×42, 21×32, 24×28</p></div><a class="button" href="./index.html#factor-calculator">Back to Arthur Tube</a></div></div></main><script>const n=document.getElementById('n'),r=document.getElementById('r');function go(){const x=Number(n.value);if(!Number.isSafeInteger(x)||x<1){r.innerHTML='<strong>Please enter a positive whole number.</strong>';return}const p=[];let c=[1,x];for(let a=1;a*a<=x;a++)if(x%a===0){let b=x/a;p.push([a,b]);c=[a,b]}r.innerHTML='<strong>'+x+' = '+c[0]+' × '+c[1]+'</strong><p>Difference: '+(c[1]-c[0])+'</p><p>Factor pairs: '+p.map(q=>q[0]+'×'+q[1]).join(', ')+'</p>'}document.getElementById('go').onclick=go;n.addEventListener('keydown',e=>{if(e.key==='Enter')go()});</script></body></html>
