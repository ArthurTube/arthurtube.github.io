<!doctype html><html><meta charset="utf-8"><title>Aperial sound encoding</title><body><script src="jukeebox_link_engine.js"></script><script src="source_song_combiner.js"></script><script src="sound_headroom_check.js"></script><script src="sound_mode_conversion.js"></script><script>
addEventListener('message',async e=>{if(e.source!==parent)return;const d=e.data;if(d?.type!=='aperial-source-song-request')return;try{let A=d.A,B=d.B;if(d.urlA)A=new beepbox.Song(d.urlA.split('#')[1]).toJsonObject();if(d.urlB)B=new beepbox.Song(d.urlB.split('#')[1]).toJsonObject();const mixed=AperialSourceSongCombiner.combine(A,B,d.n,d.a,d.b);if(d.name)mixed.json.name=d.n+' '+d.name+' - source layer draft';const converted=AperialSoundMode.convert(mixed.json,d.mode||'source');const checked=await AperialSoundHeadroom.checkAndAdjust(beepbox,converted.json,{yieldUI:true});parent.postMessage({type:'aperial-source-song-result',id:d.id,url:checked.url,json:checked.json,seconds:mixed.seconds,headroom:checked.headroom,mode:converted.mode,changedNotes:converted.changedNotes,notes:mixed.notes+' '+(converted.note||'Source pitches retained.')+' Output gain adjusted only when needed; three-loop peak check passed at player volume 100%.'},'*');}catch(err){parent.postMessage({type:'aperial-source-song-result',id:d.id,error:String(err.message)},'*');}});parent.postMessage({type:'aperial-source-song-ready'},'*');
</script></body></html>
